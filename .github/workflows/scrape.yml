name: Termine aktualisieren

on:
  schedule:
    - cron: '0 3 * * *' # Jeden Tag um 3 Uhr nachts
  workflow_dispatch: # Auch manuell startbar

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120 # Maximal 2 Stunden

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhängigkeiten installieren
        run: pip install requests beautifulsoup4

      - name: Alte events.json löschen (Neustart erzwingen)
        run: rm -f events_final.json

      - name: Scraper ausführen
        run: python scraper_v2.py

      - name: Ergebnis umbenennen
        run: mv events_final.json events.json

      - name: events.json committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add events.json
          git diff --staged --quiet || git commit -m "Termine aktualisiert $(date '+%d.%m.%Y')"
          git pull --rebase origin main
          git push
