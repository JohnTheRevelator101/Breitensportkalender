name: Termine aktualisieren

on:
  schedule:
    - cron: '0 3 * * 1'  # Montag   03:00 - naechste 90 Tage
    - cron: '0 3 * * 2'  # Dienstag 03:00 - 91-180 Tage
    - cron: '0 3 * * 3'  # Mittwoch 03:00 - 181-270 Tage
    - cron: '0 3 * * 4'  # Donnerstag 03:00 - 271-365 Tage
  workflow_dispatch:      # Auch manuell startbar

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhaengigkeiten installieren
        run: pip install requests beautifulsoup4

      - name: Scraper ausfuehren
        run: python scraper_v2.py

      - name: Ergebnis umbenennen
        run: mv events_final.json events.json

      - name: events.json committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add events.json
          git diff --staged --quiet || git commit -m "Termine aktualisiert $(date '+%d.%m.%Y')"
          git pull --rebase origin main
          git push
